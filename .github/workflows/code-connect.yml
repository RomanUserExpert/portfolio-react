# Publishes Code Connect snippets (figma/*.figma.ts) to Figma Dev Mode when they change on main,
# so a template edit can never sit unpublished. Parses first and stops on any unreadable template.
# Publishing from here also re-asserts the CLI templates over links made by hand in Figma's Code Connect UI.
name: Code Connect

on:
  push:
    branches: [main]
    paths:
      - 'figma/**'
      - 'figma.config.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p figma/tsconfig.json
      - run: npx figma connect parse --exit-on-unreadable-files --skip-update-check > /dev/null
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      # The CLI has no retries and Figma's API answers 503 for minutes after large edits: try up to 4 times.
      - run: |
          for wait in 20 60 120 0; do
            npx figma connect publish --exit-on-unreadable-files --skip-update-check && exit 0
            [ "$wait" = 0 ] && break
            echo "publish failed, retrying in ${wait}s"; sleep "$wait"
          done
          echo "::error::Code Connect publish failed 4 times (Figma API down?). Re-run this workflow later."
          exit 1
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
